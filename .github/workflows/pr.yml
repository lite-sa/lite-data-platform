# PR gate: lint + test the uv workspace on every PR to main.
name: PR

on:
  pull_request:
    branches: [main]

# Least privilege: this job only reads the checkout.
permissions:
  contents: read

# One in-flight run per branch; new pushes cancel the old run.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (pinned for parity with cloudbuild/pr.yaml)
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
          python-version: "3.13"
          enable-cache: true

      - name: Sync workspace (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
