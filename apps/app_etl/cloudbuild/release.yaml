# Release: build the app-etl image and push it to Artifact Registry on merge
# to main, tagged $SHORT_SHA (never :latest), so a rollback is a re-deploy of
# an older tag.
#
# Pointing the Cloud Run Jobs at the new tag is a manual
# `gcloud run jobs update --image=...` for now.
substitutions:
  _REGION: ""
  _AR_REPO: ""
  _PROJECT_ID: ""

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/app_etl/Dockerfile
      - -t
      - $_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/app-etl:$SHORT_SHA
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/app-etl:$SHORT_SHA

images:
  - $_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/app-etl:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
