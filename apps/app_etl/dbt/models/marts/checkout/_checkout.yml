version: 2

models:
  - name: checkout_sessions
    description: >
      One row per hosted checkout session: product's checkout-debugging
      table in Metabase. Session facts from the staging allowlist plus
      merchant_name, the channel's name/type, is_test_merchant and
      effective_status. FULL REBUILD on every dbt build. Test merchants
      are INCLUDED and flagged, unlike the payments fact, because product
      debugs with them. No PII: the shopper, order and metadata blobs,
      the capability URL and the raw redirect URLs stop at staging.
      Session status is written lazily at source and is not an outcome;
      join to payments on (merchant_id, order_id) for the truth (nb 026).
    columns:
      - name: checkout_session_id
        description: Grain.
        tests: [not_null, unique]
      - name: merchant_id
        tests: [not_null]
      - name: merchant_name
        description: >
          A warn here is the drift detector for the business_id join
          contract, as on payments.
        tests:
          - not_null:
              config:
                severity: warn
      - name: is_test_merchant
        description: >
          True for the test_merchants seed ids. Included on purpose
          (product debugs with them); exclude before counting anything.
        tests: [not_null]
      - name: order_id
        description: >
          The merchant's order reference and the only link to payments
          (payments.order_id, together with merchant_id). Order grain:
          several sessions or payments can share one.
        tests: [not_null]
      - name: status
        description: >
          The session status exactly as at source. Overcounts Pending:
          the service rewrites it only when the pay page re-reads the
          session, and expiry is never written back. A warn here means a
          value outside the service enum appeared.
        tests:
          - not_null
          - accepted_values:
              values: [Pending, Completed, Failed, Expired, Cancelled]
              config:
                severity: warn
      - name: effective_status
        description: >
          status, with Pending past expires_on read as Expired. Evaluated
          at build time, so a session expiring after the morning build
          reads Pending until the next one.
        tests:
          - not_null
          - accepted_values:
              values: [Pending, Completed, Failed, Expired, Cancelled]
              config:
                severity: warn
      - name: amount
        description: >
          Major units (amount_minor / 100, or / 1000 for the
          three-decimal currencies), the same rule as payments.amount.
      - name: currency
        tests: [not_null]
      - name: channel_id
        description: >
          The session's sales channel, resolved to channel_name/type
          through stg_litecore__channels. The source default literal
          'default' and a handful of unknown ids resolve to NULL.
      - name: redirect_success_host
        description: >
          Host of the merchant's success return URL. Path and query stay
          in raw (they carry tokens); same for redirect_failure_host.
      - name: idempotency_key_sha256
        description: >
          sha256 of the merchant-supplied idempotency key. Equal hashes
          mean the same key; the key itself stays in raw.
      - name: expires_on
        description: >
          When the hosted page stops accepting payment (default 24 h
          after created_at). UTC; expires_on_local is Asia/Riyadh.
        tests: [not_null]
      - name: created_at
        description: >
          Partition column (UTC). Filter on this one for partition
          pruning; created_at_local is Asia/Riyadh.
        tests: [not_null]
