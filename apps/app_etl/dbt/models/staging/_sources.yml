version: 2

sources:
  - name: litecore
    description: >
      dlt-landed raw tables (see ../ingestion), named
      <source_database>__<source_table>. Watermarked with a 10-min
      safety lag, so "now" here is always at least SAFETY_LAG behind the
      source. Only the tables the models actually read are declared —
      add others when a model needs them.
    database: "{{ env_var('GCP_PROJECT') }}"
    schema: "{{ env_var('BQ_DATASET_RAW', 'raw_litecore') }}"
    tables:
      - name: payment_v2__payments
        description: One row per payment intent; owns merchant_id.
      - name: payment_v2__payment_operations
        description: >
          Append-only operation log (authorize/capture/refund/…) per
          payment; owns terminal_id, operation_type, POS fields.
      - name: payment_v2__threeds
        description: >
          EMV 3DS authentication attempts. payment_id -> payments.id but
          nullable (an auth can exist before/without its payment) and
          retry-capable — readers dedup per payment. PII-dense: staging
          exposes a strict allowlist (docs/schema-management.md §1).
      - name: business_management__business_entities
        description: >
          Merchant registry, `replace` disposition — latest state only,
          no version history yet. business_id (not id, the source PK) is
          what payments.merchant_id references.
      - name: smart_routing__transaction_evaluation
        description: >
          One row per smart-routing evaluation; payment_id -> payments.id.
          Ecom pipeline only — POS payments never route. The routing
          decision lives in the routing_obj JSON, matched rules in
          matched_rules.
      - name: checkout_session__checkout_sessions
        description: >
          One row per hosted checkout session (checkout-session-service,
          its own database). No FK to payments in either direction: the
          verified link is (merchant_id, order_id) -> payments, order
          grain (nb 026). status is written lazily at source. PII-dense
          (customer/metadata/order_data JSONB, payment_url, tokenised
          redirect_urls): staging exposes a strict allowlist
          (docs/schema-management.md §1).
      - name: business_management__channels
        description: >
          Per-merchant sales channels (POS store, ecom API / hosted
          checkout / payment link), `replace` disposition. id is what
          payments.channel_id and checkout_sessions.channel_id reference;
          business_id -> business_entities.id (the source PK).
