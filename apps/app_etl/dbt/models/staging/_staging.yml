version: 2

models:
  - name: stg_litecore__payments
    description: >
      Latest version per payment (raw appends one row per source-row
      version). The unique test below is the dedup contract — if it
      fails, the qualify clause or the raw grain regressed. Exposes the
      scalar card facts (card_brand, instrument_type, card_last_four,
      future_usage) extracted from instrument_data; the blob itself
      never leaves this view.
    columns:
      - name: payment_id
        tests: [not_null, unique]

  - name: stg_litecore__payment_operations
    description: >
      Latest version per payment operation, plus local wall-clock
      timestamps for time-of-day rules. The POS receipt scalars
      (external_operation_type, verification_method,
      reconciliation_status, frontend_error, receipt_outcome) are
      extracted from the metadata JSONB here; the blob — raw provider
      payloads — never leaves this view.
    columns:
      - name: payment_operation_id
        tests: [not_null, unique]

  - name: stg_litecore__routing_evaluations
    description: >
      Latest version per smart-routing evaluation (grain:
      routing_evaluation_id — one COMPLETED row per authorize in the
      happy path plus retries; readers pick the first per payment).
      operation_type is stored lowercase and routing_obj keys are
      snake_case — both prod-verified (nb 022/023) and baked into the
      extraction.
    columns:
      - name: routing_evaluation_id
        tests: [not_null, unique]

  - name: stg_litecore__threeds
    description: >
      Latest version per 3DS authentication attempt (grain: threeds_id —
      a payment can have several attempts; readers dedup per payment).
      Strict PII allowlist: the shopper JSONB and EMV 3DS artifacts never
      pass this view. ''-vs-NULL source mixing normalized to NULL.
    columns:
      - name: threeds_id
        tests: [not_null, unique]

  - name: stg_litecore__business_entities
    description: >
      Latest version per merchant, keyed by business_id (what
      payments.merchant_id references). Two-column allowlist — the
      display name only; the rest of the registry profile stays behind
      raw IAM.
    columns:
      - name: merchant_id
        tests: [not_null, unique]

  - name: stg_litecore__checkout_sessions
    description: >
      Latest version per hosted checkout session (grain:
      checkout_session_id). PII allowlist: the customer, metadata and
      order_data JSONB blobs and payment_url never pass this view
      (presence booleans only); redirect_urls passes as hosts only;
      idempotency_key passes as a sha256. The only link to payments is
      (merchant_id, order_id).
    columns:
      - name: checkout_session_id
        tests: [not_null, unique]

  - name: stg_litecore__channels
    description: >
      Latest version per sales channel (grain: channel_id), what
      payments.channel_id and checkout_sessions.channel_id point at.
      Allowlist: name, type/sub_type, status, is_default. Addresses,
      lat/long, receipt footers, terminal counts and operator ids stay
      behind raw IAM. Raw is `replace` disposition, so the dedup is
      defensive.
    columns:
      - name: channel_id
        tests: [not_null, unique]
