version: 2

seeds:
  - name: test_merchants
    description: >
      The canonical test-merchant ids. The payments mart anti-joins this seed, so test traffic
      never reaches core marts.
    config:
      column_types:
        merchant_id: string
        note: string
    columns:
      - name: merchant_id
        tests: [not_null, unique]

  - name: decline_code_map
    description: >
      connector_response_code → human decline_reason, the highest-volume
      codes only (nb 023's map). TSP/NearPay 3-digit codes are read as
      ISO 8583:1993 action codes — an assumption to confirm against
      NearPay docs before any merchant-facing copy uses the labels.
      Deliberately unmapped: TSP `196` (21% of TSP declines, nb 015's
      open NearPay question) and `204` — unmapped codes keep a NULL
      decline_reason in the fact, they are not errors. One namespace for
      all connectors: TSP codes are numeric strings, mpgs codes are
      gatewayCode literals, so they cannot collide.
    config:
      column_types:
        connector_response_code: string
        decline_reason: string
        note: string
    columns:
      - name: connector_response_code
        tests: [not_null, unique]
      - name: decline_reason
        tests: [not_null]
