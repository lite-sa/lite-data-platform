# Light transformation layer over the dlt-landed raw tables. Same
# philosophy as ingestion: bespoke models on a standard framework, no
# abstraction until duplication hurts.
name: app_etl
version: "0.1.0"
profile: app_etl

model-paths: ["models"]
test-paths: ["tests"]
# Seeds are this project's constants.py: reference data committed as CSV
# (test-merchant ids today; gateway response-code decode maps next),
# ref()-able like any model. dbt build loads them before the models.
seed-paths: ["seeds"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Business-local wall clock, used stack-wide for local-day boundaries
  # (Saudi operations; the whole stack is me-central2). Asia/Riyadh is
  # UTC+3, no DST.
  local_timezone: "Asia/Riyadh"

models:
  app_etl:
    staging:
      +materialized: view
    # Marts are full-rebuild tables: the payment-grain fact (payments)
    # and the daily funnel aggregate reading it (payments_daily_summary
    # — the microbatch evaluation-log shape it used to be is documented
    # in docs/dbt-primer.md §5 if one returns). Materialization configs
    # live in each model's config block because they are semantic, not
    # tuning. Everything builds into one dataset, BQ_DATASET_CORE
    # (profiles.yml).
    marts:
      +materialized: table
      # Descriptions from the _*.yml files land on the BigQuery tables and
      # columns, which is what Metabase shows. BigQuery caps a column
      # description at 1,024 characters and the build fails past it;
      # tests/test_dbt_docs.py gates every description at that length.
      # Long-form notes live in .claude/skills/metabase-data-questions/.
      +persist_docs:
        relation: true
        columns: true
    # The litecore mirror: one table per raw table of the payment_v2,
    # ledger, settlement and checkout_session databases, latest version
    # per id, PII columns removed (docs/schema-management.md §1),
    # published to the payments team in Metabase. It builds into the same
    # dataset as everything else (BQ_DATASET_CORE): the CISO approval for
    # Metabase covers READER on `core` only, and the redaction is what
    # makes a raw copy publishable there. No +schema, no routing.
    litecore:
      +materialized: table
      +persist_docs:
        relation: true
        columns: true
