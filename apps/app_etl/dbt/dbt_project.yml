# Light transformation layer over the dlt-landed raw tables. Same
# philosophy as ingestion: bespoke models on a standard framework, no
# abstraction until duplication hurts.
name: app_etl
version: "0.1.0"
profile: app_etl

model-paths: ["models"]
test-paths: ["tests"]
# Seeds are this project's constants.py: reference data committed as CSV
# (test-merchant ids today; gateway response-code decode maps next),
# ref()-able like any model. dbt build loads them before the models.
seed-paths: ["seeds"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Business-local wall clock, used stack-wide for local-day boundaries
  # (Saudi operations; the whole stack is me-central2). Asia/Riyadh is
  # UTC+3, no DST.
  local_timezone: "Asia/Riyadh"

models:
  app_etl:
    staging:
      +materialized: view
    # Marts are full-rebuild tables; partition and cluster configs live in
    # each model's config block. Everything builds into one dataset,
    # BQ_DATASET_CORE (profiles.yml).
    marts:
      +materialized: table
      # Descriptions land on the BigQuery tables and columns, which is
      # what Metabase shows. BigQuery fails the build past 1,024
      # characters; tests/test_dbt_docs.py enforces the cap.
      +persist_docs:
        relation: true
        columns: true
    # The litecore mirror: one table per raw table of the payment_v2,
    # ledger, settlement, checkout_session, payout, business_management,
    # pricing_engine and smart_routing databases, latest version per id,
    # PII columns removed. Builds into BQ_DATASET_CORE like
    # everything else: Metabase can read `core` only.
    litecore:
      +materialized: table
      +persist_docs:
        relation: true
        columns: true
